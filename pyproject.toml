[project]
name = "rag-cnrs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "pymupdf",
    "qdrant-client",
    "rank-bm25",
    "sentence-transformers",
    "transformers",
    "torch",
    "huggingface-hub",
    "tqdm",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
