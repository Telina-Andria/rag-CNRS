[project]
name = "rag-cnrs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "pymupdf",
    "qdrant-client",
    "rank-bm25",
    "sentence-transformers",
    "transformers",
    "torch",
    "huggingface-hub",
    "tqdm",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "anthropic>=0.122.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "mypy",
    "pytest",
    "testcontainers",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Scripts legacy déplacés tels quels (voir src/chunking/heading.py), non modifiés.
"src/chunking/heading_chunking.py" = ["E741", "B905"]
"src/chunking/build_chunks.py" = ["E741", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

# src/chunking/heading_chunking.py et src/chunking/build_chunks.py (scripts
# legacy, déplacés sans modification, voir src/chunking/heading.py) : non
# couverts par mypy pour éviter de les modifier alors qu'ils sont
# volontairement laissés inchangés.
[[tool.mypy.overrides]]
module = ["src.chunking.heading_chunking", "src.chunking.build_chunks"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
